<style>
.fh-slider{width:100%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:1.5rem;position:relative}
.fh-slider-track{position:relative;width:100%;height:420px;background:#111;overflow:hidden}
.fh-slide{display:none;width:100%;height:420px;position:absolute;top:0;left:0}
.fh-slide.active{display:block}
.fh-slide img{width:100%;height:420px;object-fit:cover;display:block}
.fh-slide video{width:100%;height:420px;object-fit:cover;display:block}
.fh-prev,.fh-next{position:absolute;top:50%;transform:translateY(-50%);z-index:30;background:rgba(0,0,0,.6);color:#fff;border:none;width:44px;height:60px;font-size:1.8rem;cursor:pointer;border-radius:8px;transition:.2s}
.fh-prev{left:10px}.fh-next{right:10px}
.fh-prev:hover,.fh-next:hover{background:#00c896;color:#000}
.fh-counter{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:.2rem .8rem;border-radius:20px;z-index:20}
.fh-thumbs{display:flex;gap:6px;padding:8px;background:rgba(0,0,0,.8);overflow-x:auto}
.fh-thumb{width:74px;height:56px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;transition:.2s}
.fh-thumb.active{border-color:#00ffc8}
.fh-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fh-no-image{width:100%;height:300px;background:#111;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#333;font-size:3rem;margin-bottom:1.5rem}
</style>
<script>
(function(){
  var _cur=0,_slides,_thumbs,_counter;
  function _init(){
    _slides=document.querySelectorAll('.fh-slide');
    _thumbs=document.querySelectorAll('.fh-thumb');
    _counter=document.getElementById('fhCounter');
  }
  function _go(n){
    if(!_slides||!_slides.length)return;
    _slides[_cur].classList.remove('active');
    if(_thumbs[_cur])_thumbs[_cur].classList.remove('active');
    var v=_slides[_cur].querySelector('video');
    if(v)v.pause();
    _cur=((n%_slides.length)+_slides.length)%_slides.length;
    _slides[_cur].classList.add('active');
    if(_thumbs[_cur])_thumbs[_cur].classList.add('active');
    if(_counter)_counter.textContent=(_cur+1)+' / '+_slides.length;
  }
  window.fhNext=function(){_go(_cur+1)};
  window.fhPrev=function(){_go(_cur-1)};
  window.fhGoto=function(n){_go(n)};
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',_init);
  }else{_init();}
  setInterval(function(){if(_slides&&_slides.length>1)_go(_cur+1);},5000);
})();
</script>
